name: Update Arcaea Game Data

on:
  workflow_dispatch:

concurrency:
  group: arcaea-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout producer
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests

      - name: Acquire shared APK
        id: acquire
        env:
          PYWIKIBOT_PASSWORD_FILE_CONTENT: ${{ secrets.PYWIKIBOT_PASSWORD_FILE_CONTENT }}
        run: uv run listen_update.py

      - name: Checkout story history
        id: history
        uses: actions/checkout@v4
        with:
          repository: SkyEye-FAST/arcaea_story
          ref: main
          path: arcaea_story
          ssh-key: ${{ secrets.STORY_DEPLOY_KEY }}

      - name: Export and publish story snapshot
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' && steps.history.outcome == 'success' }}
        env:
          APK: ${{ steps.acquire.outputs.apk }}
          VERSION: ${{ steps.acquire.outputs.version }}
        run: |
          uv run story_history.py --apk "$APK" --repository arcaea_story
          git -C arcaea_story add --all -- story story2
          if ! git -C arcaea_story diff --cached --quiet; then
            git -C arcaea_story -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m "$VERSION"
            git -C arcaea_story push origin HEAD:main
          fi

      - name: Generate Wiki outputs
        id: generate
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        env:
          APK: ${{ steps.acquire.outputs.apk }}
          VERSION: ${{ steps.acquire.outputs.version }}
        run: uv run update.py --apk "$APK" --version "$VERSION"

      - name: Save generated Wiki data
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          git add --all -- output
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'chore: update data'
            git push origin HEAD:main
          fi

      - name: Sync Wiki pages
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          PYWIKIBOT_PASSWORD_FILE_CONTENT: ${{ secrets.PYWIKIBOT_PASSWORD_FILE_CONTENT }}
          VERSION: ${{ steps.acquire.outputs.version }}
        run: |
          test -n "$PYWIKIBOT_PASSWORD_FILE_CONTENT"
          uv run sync_wiki.py --summary "Bot: Sync data to v$VERSION"
